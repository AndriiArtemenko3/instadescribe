# Alembic configuration for the InstaDescribe cloud database (G2).
# The connection URL is taken from the DATABASE_URL environment variable in
# migrations/env.py — never hard-code credentials here.
[alembic]
# %(here)s makes the config location-independent (repo root locally,
# /srv inside the API image).
script_location = %(here)s/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
