name: Bug report
description: Report a reproducible defect using sanitized, non-sensitive evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Do not include API keys, signed URLs, customer media, personal data or private infrastructure details. Security findings belong in private vulnerability reporting.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, branch or package version where the issue occurs.
      placeholder: 0123456789abcdef or 1.0.0-beta.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python/Node versions and relevant local service versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or rights-cleared fixtures and sanitize all output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, signed URLs, customer media, personal data and private infrastructure details.
          required: true
        - label: This is not a security vulnerability.
          required: true
