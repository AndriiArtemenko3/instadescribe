name: Publish SDK and CLI

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact version present in both package manifests
        required: true
        type: string
      dist_tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      customer_canary_complete:
        description: Required for a stable latest release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish SDK, then CLI
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'sdk-cli-v')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use an npm client with trusted-publishing support
        run: npm install --global npm@11.6.2
      - name: Verify release intent and package versions
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
          CUSTOMER_CANARY_COMPLETE: ${{ inputs.customer_canary_complete }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const expected = process.env.EXPECTED_VERSION;
            const tag = process.env.DIST_TAG;
            const canary = process.env.CUSTOMER_CANARY_COMPLETE === "true";
            const refType = process.env.RELEASE_REF_TYPE;
            const refName = process.env.RELEASE_REF_NAME;
            const sdk = JSON.parse(readFileSync("packages/sdk/package.json", "utf8"));
            const cli = JSON.parse(readFileSync("packages/cli/package.json", "utf8"));
            if (!expected || sdk.version !== expected || cli.version !== expected) {
              throw new Error("expected_version must exactly match both package manifests");
            }
            if (cli.dependencies?.["@instadescribe/sdk"] !== expected) {
              throw new Error("CLI must depend on the exact SDK release version");
            }
            if (refType !== "tag" || refName !== `sdk-cli-v${expected}`) {
              throw new Error("publishing requires the immutable sdk-cli-v<version> tag");
            }
            const prerelease = expected.includes("-");
            if (tag === "next" && !prerelease) {
              throw new Error("the next tag requires a prerelease version");
            }
            if (tag === "latest" && (prerelease || !canary)) {
              throw new Error("latest requires a stable version and completed customer canary");
            }
          '
      - name: Install API schema dependencies
        run: pip install -r services/api/requirements-dev.txt
      - name: Install the exact workspace lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated contracts
        run: npm run codegen:check
      - name: Typecheck, test and build packages
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run package:check
          npm run package:smoke
      - name: Publish SDK with OIDC provenance
        run: npm publish --workspace @instadescribe/sdk --access public --provenance --tag "${{ inputs.dist_tag }}"
      - name: Publish CLI with the exact SDK dependency
        run: npm publish --workspace instadescribe --access public --provenance --tag "${{ inputs.dist_tag }}"
