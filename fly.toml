# Fly.io config for the InstaDescribe study backend (single-origin: serves SPA + API).
# Deploy:  fly deploy   (after `fly auth login` + a card on the account)
# The old slug is an existing physical deployment identity and is retained
# only for legacy rollback/evidence compatibility.
app = "instascribe-study"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8765"
  STUDY_CORS_ORIGINS = "*"
  # OPENAI_API_KEY and STUDY_QUESTIONNAIRE_URL are set as secrets, not here.

[http_service]
  internal_port = 8765
  force_https = true
  # Legacy evidence runtime retains its existing availability posture.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"   # headroom for ffmpeg + concurrent TTS renders
