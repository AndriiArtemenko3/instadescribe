# Fly.io config for the InstaDescribe study backend (single-origin: serves SPA + API).
# Deploy:  fly deploy   (after `fly auth login` + a card on the account)
# The old slug is an existing physical deployment identity and is retained
# only for legacy rollback/evidence compatibility.
app = "instascribe-study"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8765"
  # The legacy Flask surface has no server-side authentication. Keep browser
  # access scoped even while the app is retained only as rollback evidence.
  STUDY_CORS_ORIGINS = "https://instadescribe.com"
  # OPENAI_API_KEY and STUDY_QUESTIONNAIRE_URL are set as secrets, not here.

[http_service]
  internal_port = 8765
  force_https = true
  # Fail closed: do not reactivate the unauthenticated legacy surface until an
  # explicit authentication/route-allowlist review has been completed.
  auto_stop_machines = "stop"
  auto_start_machines = false
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"   # headroom for ffmpeg + concurrent TTS renders
